<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="./login.css" rel="stylesheet">
    <title>Login</title>
  </head>
  <body>
    <div class="container"> 
        <form class="mx-auto">
            <h4 class="text-center">Login</h4>
            <div class="mb-3 mt-5">
              <label for="exampleInputEmail1" class="form-label">User Name</label>
              <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
            </div>

            <div class="mb-3">
              <label for="exampleInputPassword1" class="form-label">Password</label>
              <input type="password" class="form-control" id="exampleInputPassword1">
              <a href="#" id="nopasswordlink" class="nopassword">Forget your password?</a>
            </div>
            
            <button type="submit" class="btn btn-primary mt-3">Login </button>
            <div class="text-center mt-3">
              <p>Don't have an account?<span>&nbsp;</span><a href="#" id="signuplink" class="signuplink">Sign Up</a></p>
            </div>  
          </form>
    </div>
    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <script>
      document.getElementById("signuplink").addEventListener("click", function(event) {
        event.preventDefault(); // Prevent the default link behavior
        window.location.href = "signup.html"; // Redirect to signup.html
      });
    </script>

  </body>
</html>
