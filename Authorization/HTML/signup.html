<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" 
          crossorigin="anonymous"
          >
    <link href="/Authorization/CSS/signup.css" 
          rel="stylesheet"
          >
    <link rel=”stylesheet” 
          href=”https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css” 
          />
    <link rel=”stylesheet” 
          href=”https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css” integrity=”sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T” 
          crossorigin=”anonymous”
          >
    <title>Sign Up</title>
  </head>
  <body>
    <div class="container">
        <form class="mx-auto">
            <h4 class="text-center">Sign Up</h4>
            <div class="mb-3 mt-5">
              <label for="exampleInputEmail1" class="form-label">User Name</label>
              <input required type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="User name or email">
            </div>

            <div class="mb-3">
              <label for="exampleInputPassword1" class="form-label">Password</label>
              <input required type="password" class="form-control" id="exampleInputPassword1" placeholder="Password">
            </div>

            <div class="mb-3">
                <label for="exampleInputPassword2" class="form-label">Confirm password</label>
                <input required type="password" class="form-control" id="exampleInputPassword2" placeholder="Confirm password">
              </div>
            
            <button type="submit" class="btn btn-primary mt-3">Sign Up</button>
            <div class="text-center mt-3">
              <p>Already have an account?<span>&nbsp;</span><a href="login.html" class="link-login">Login</p>
            </div>  
        
          </form>
    </div>
    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" 
            crossorigin="anonymous">
    </script>
  </body>
</html>
